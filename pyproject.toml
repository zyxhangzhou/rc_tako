[project]
name = "notifier"
version = "0.1.0"
description = "API 通知投递服务"
requires-python = ">=3.12"
dependencies = [
    "fastapi==0.159.1",
    "uvicorn==0.54.0",
    "pydantic==2.14.1",
    "httpx==0.28.1",
]

[project.scripts]
notifier-worker = "notifier.worker:main"

[project.optional-dependencies]
test = [
    "pytest==9.1.1",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
